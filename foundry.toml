[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
  "@gluwa/asc-contracts/=lib/asc-contracts/",
  "forge-std/=lib/forge-std/"
]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"

[lint]
lint_on_build = false
